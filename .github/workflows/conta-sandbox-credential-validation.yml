name: Conta Sandbox Credential Validation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Confirm this non-executing sandbox validation
        required: true
        type: choice
        options:
          - VALIDATE_SANDBOX_CREDENTIALS_ONLY

permissions:
  contents: read

concurrency:
  group: conta-sandbox-credential-validation
  cancel-in-progress: false

jobs:
  validate-sandbox-boundary:
    name: Validate sandbox boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: conta-sandbox-secrets
    env:
      CONTA_API_KEY: ${{ secrets.CONTA_API_KEY }}
      CONTA_ORG_ID: ${{ secrets.CONTA_ORG_ID }}
      CONTA_MCP_BEARER_TOKEN: ${{ secrets.CONTA_MCP_BEARER_TOKEN }}
    steps:
      - name: Verify requested operation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.operation }}" != "VALIDATE_SANDBOX_CREDENTIALS_ONLY" ]]; then
            echo "Unsupported operation." >&2
            exit 1
          fi

      - name: Check out canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'

      - name: Validate source and fail-closed controls
        shell: bash
        run: |
          set -euo pipefail
          find app bin config public tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/controlled-write-foundation.php
          php tests/remaining-control-paths.php
          php -r '$j=json_decode(file_get_contents("config/write-kill-switch.example.json"),true); if (($j["globalBlocked"] ?? null) !== true) exit(1);'
          php -r '$j=json_decode(file_get_contents("config/sandbox-authorization.example.json"),true); if (($j["status"] ?? null) !== "PENDING_OPERATOR_VALIDATION") exit(1);'

      - name: Verify required sandbox secrets are present
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CONTA_API_KEY CONTA_ORG_ID CONTA_MCP_BEARER_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required environment secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

          echo "Required sandbox secrets are configured."
          echo "No secret values were printed."
          echo "No provider request or Conta mutation was performed."

      - name: Record non-execution boundary
        shell: bash
        run: |
          {
            echo "## Conta sandbox credential validation"
            echo
            echo "- Environment approval passed."
            echo "- Repository validation passed."
            echo "- Required sandbox secrets are present."
            echo "- Provider call performed: false."
            echo "- Sandbox mutation performed: false."
            echo "- Production deployment performed: false."
            echo "- Write enablement changed: false."
          } >> "$GITHUB_STEP_SUMMARY"

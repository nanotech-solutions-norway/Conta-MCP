name: Conta Non-Mutating Post-Deployment Tools

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type VALIDATE_CONTA_NON_MUTATING_TOOLS_20260816
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conta-non-mutating-post-deployment-tools
  cancel-in-progress: false

jobs:
  validate-tools:
    name: Validate bounded non-mutating tool sequence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: conta-sandbox-secrets
    env:
      VALIDATION_AUTHORIZATION: ${{ inputs.authorization }}
      CONTA_MCP_BEARER_TOKEN: ${{ secrets.CONTA_MCP_BEARER_TOKEN }}

    steps:
      - name: Checkout accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Enforce exact non-mutating authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "main" ]]
          [[ "$VALIDATION_AUTHORIZATION" == "VALIDATE_CONTA_NON_MUTATING_TOOLS_20260816" ]]
          [[ -n "${CONTA_MCP_BEARER_TOKEN:-}" ]]
          echo "NON_MUTATING_TOOL_AUTHORIZATION_BOUND=true"
          echo "READ_ONLY_PROVIDER_CALL_LIMIT=1"
          echo "PROVIDER_MUTATION_AUTHORIZED=false"
          echo "PRODUCTION_WRITE_AUTHORIZED=false"

      - name: Validate bounded non-mutating tool sequence
        run: python .github/scripts/validate_non_mutating_post_deployment_tools.py

name: Conta Authenticated Post-Deployment Contract

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type VALIDATE_CONTA_AUTHENTICATED_POST_DEPLOYMENT_7D97A633
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conta-authenticated-post-deployment-contract
  cancel-in-progress: false

jobs:
  validate-contract:
    name: Validate authenticated initialize and tools list only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: conta-sandbox-secrets
    env:
      VALIDATION_AUTHORIZATION: ${{ inputs.authorization }}
      CONTA_MCP_BEARER_TOKEN: ${{ secrets.CONTA_MCP_BEARER_TOKEN }}

    steps:
      - name: Checkout accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Enforce exact read-only authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "main" ]]
          [[ "$VALIDATION_AUTHORIZATION" == "VALIDATE_CONTA_AUTHENTICATED_POST_DEPLOYMENT_7D97A633" ]]
          [[ -n "${CONTA_MCP_BEARER_TOKEN:-}" ]]
          echo "AUTHENTICATED_CONTRACT_AUTHORIZATION_BOUND=true"
          echo "TOOLS_CALL_AUTHORIZED=false"
          echo "PROVIDER_CALL_AUTHORIZED=false"
          echo "PRODUCTION_WRITE_AUTHORIZED=false"

      - name: Validate authenticated MCP contract
        run: python .github/scripts/validate_authenticated_post_deployment_contract.py

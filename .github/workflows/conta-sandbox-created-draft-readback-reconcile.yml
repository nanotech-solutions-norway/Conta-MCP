name: Conta Sandbox Created Draft Readback Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/conta-sandbox-created-draft-readback-reconcile.php'
      - '.github/workflows/conta-sandbox-created-draft-readback-reconcile.yml'
      - 'docs/rollout/SANDBOX_CREATED_DRAFT_READBACK_RECONCILIATION_20260816.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conta-sandbox-created-draft-readback-reconciliation
  cancel-in-progress: false

jobs:
  reconcile-created-draft:
    name: Reconcile existing sandbox draft using GET only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: conta-sandbox-secrets
    env:
      CONTA_ENVIRONMENT: ${{ vars.CONTA_ENVIRONMENT }}
      CONTA_API_BASE_URL: ${{ vars.CONTA_API_BASE_URL }}
      CONTA_API_KEY: ${{ secrets.CONTA_API_KEY }}
      CONTA_ORG_ID: ${{ secrets.CONTA_ORG_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify GET-only sandbox boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTA_ENVIRONMENT" == "sandbox" ]] || { echo "Protected environment is not sandbox." >&2; exit 1; }
          [[ "$CONTA_API_BASE_URL" == "https://api.gateway.conta-sandbox.no" ]] || { echo "Unexpected Conta API base URL." >&2; exit 1; }
          [[ -n "${CONTA_API_KEY:-}" ]] || { echo "Missing protected Conta API key." >&2; exit 1; }
          [[ "$CONTA_ORG_ID" =~ ^[0-9]+$ ]] || { echo "Invalid protected organization identifier." >&2; exit 1; }
          if grep -En "request\('(POST|PUT|PATCH|DELETE)'|curl.+-X[[:space:]]*(POST|PUT|PATCH|DELETE)" .github/scripts/conta-sandbox-created-draft-readback-reconcile.php; then
            echo "Mutation method detected in GET-only diagnostic." >&2
            exit 1
          fi
          echo "GET_ONLY_BOUNDARY_VERIFIED=true"
          echo "PRODUCTION_WRITE_AUTHORIZED=false"

      - name: Validate diagnostic syntax
        shell: bash
        run: php -l .github/scripts/conta-sandbox-created-draft-readback-reconcile.php

      - name: Reconcile existing created draft
        shell: bash
        run: |
          set -euo pipefail
          php .github/scripts/conta-sandbox-created-draft-readback-reconcile.php

name: Controlled Write Foundation Validation

on:
  pull_request:
  push:
    branches:
      - main
      - agent/controlled-write-foundation

permissions:
  contents: read

jobs:
  php-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax validation
        run: find app bin config public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Controlled write foundation tests
        run: php tests/controlled-write-foundation.php
      - name: Invoice draft readback verifier tests
        run: php tests/invoice-draft-readback-verifier.php
      - name: Remaining control path tests
        run: php tests/remaining-control-paths.php
      - name: Validate sandbox retry runtime patch
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/repo"
          cp -a . "$tmp/repo/"
          cd "$tmp/repo"
          python3 .github/scripts/prepare-conta-sandbox-invoice-draft-retry.py
          python3 .github/scripts/bind-conta-sandbox-invoice-draft-lineno.py
          php -l app/Config.php
          php -l .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "PROVIDER_ERROR_BODY_SHA256" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "PROVIDER_ERROR_TOP_LEVEL_KEYS" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "PROVIDER_ERROR_KEY_PATHS" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "const EXPECTED_PAYLOAD_SHA256 = '79ae9a521fb79e1852721eb4f4f25e315d3122849bfe2b2df146e761d974cee7';" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "'vatCode' => 'high'" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "'lineNo' => 1" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          php -r 'require "app/Config.php"; $c=new Config(["allowed_write_organization_ids"=>["123456789"]]); $v=$c->allowedWriteOrganizationIds(); if ($v !== ["123456789"] || !is_string($v[0])) exit(1);'
          echo "SANDBOX_RETRY_RUNTIME_PATCH_VALIDATION_PASSED=true"
      - name: Verify examples remain fail-closed
        run: |
          php -r '$j=json_decode(file_get_contents("config/write-kill-switch.example.json"),true); if (($j["globalBlocked"] ?? null) !== true) exit(1);'
          php -r '$j=json_decode(file_get_contents("config/sandbox-authorization.example.json"),true); if (($j["status"] ?? null) !== "PENDING_OPERATOR_VALIDATION") exit(1);'
      - name: Build implementation evidence artifact
        run: |
          mkdir -p artifact/source
          cp -R app bin config tests docs .github artifact/source/
          cat > artifact/IMPLEMENTATION_SUMMARY.md <<'EOF'
          # Conta MCP Remaining Control Paths — GitHub Actions Evidence

          Status: IMPLEMENTED_ON_DRAFT_PR
          Provider call performed: false
          Sandbox mutation performed: false
          Production deployment performed: false
          Live write approved: false

          Implemented controls:
          - approved release-manifest guard
          - dynamic global/action kill switch
          - signed approval and sandbox authorization documents
          - payload-bound one-call authorization
          - authorization, nonce and idempotency replay prevention
          - mandatory post-create readback verification
          - readiness and manifest CLI tooling
          - explicit one-call sandbox harness
          - permanent production-program refusal
          EOF
          (cd artifact/source && zip -qr ../Conta_MCP_Remaining_Control_Paths_Source.zip .)
          sha256sum artifact/Conta_MCP_Remaining_Control_Paths_Source.zip artifact/IMPLEMENTATION_SUMMARY.md > artifact/SHA256.txt
      - name: Upload implementation evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conta-mcp-remaining-control-paths
          path: artifact/
          if-no-files-found: error
          retention-days: 30

name: Conta Sandbox Invoice Draft Shape Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conta-sandbox-invoice-draft-shape-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-read-only-shape:
    name: Inspect sandbox invoice-draft list shape with GET only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: conta-sandbox-secrets
    env:
      CONTA_ENVIRONMENT: ${{ vars.CONTA_ENVIRONMENT }}
      CONTA_API_BASE_URL: ${{ vars.CONTA_API_BASE_URL }}
      CONTA_API_KEY: ${{ secrets.CONTA_API_KEY }}
      CONTA_ORG_ID: ${{ secrets.CONTA_ORG_ID }}
    steps:
      - name: Verify protected sandbox boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTA_ENVIRONMENT" == "sandbox" ]] || { echo "Protected environment is not sandbox." >&2; exit 1; }
          [[ "$CONTA_API_BASE_URL" == "https://api.gateway.conta-sandbox.no" ]] || { echo "Unexpected Conta API base URL." >&2; exit 1; }
          [[ -n "${CONTA_API_KEY:-}" ]] || { echo "Missing protected Conta API key." >&2; exit 1; }
          [[ "$CONTA_ORG_ID" =~ ^[0-9]+$ ]] || { echo "Invalid protected organization identifier." >&2; exit 1; }
          echo "READ_ONLY_SANDBOX_BOUNDARY=true"

      - name: Inspect response shape without values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          body="$RUNNER_TEMP/conta-invoice-draft-shape.json"
          trap 'rm -f -- "$body"' EXIT

          status=$(curl --silent --show-error --get \
            --output "$body" --write-out '%{http_code}' \
            --header "apiKey: ${CONTA_API_KEY}" \
            --header 'Accept: application/json' \
            --data-urlencode 'hits=1' \
            --data-urlencode 'page=0' \
            --data-urlencode 'sort=id' \
            --connect-timeout 15 --max-time 45 \
            "${CONTA_API_BASE_URL}/invoice/organizations/${CONTA_ORG_ID}/invoice-drafts")

          [[ "$status" == "200" ]] || { echo "READ_ONLY_GET_HTTP_STATUS=$status"; exit 1; }
          jq -e . "$body" >/dev/null || { echo "RESPONSE_JSON_VALID=false"; exit 1; }

          echo "READ_ONLY_GET_HTTP_STATUS=200"
          echo "RESPONSE_JSON_VALID=true"
          echo "BODY_TYPE=$(jq -r 'type' "$body")"

          if [[ "$(jq -r 'type' "$body")" == "object" ]]; then
            echo "TOP_LEVEL_KEYS=$(jq -r 'keys | sort | join(",")' "$body")"
            jq -r 'to_entries | sort_by(.key) | .[] | "FIELD_TYPE=" + .key + ":" + (.value|type)' "$body"
            jq -r 'to_entries | sort_by(.key) | .[] | select(.value|type=="array") | "ARRAY_LENGTH=" + .key + ":" + ((.value|length)|tostring)' "$body"
            jq -r 'to_entries | sort_by(.key) | .[] | select(.value|type=="object") | "OBJECT_KEYS=" + .key + ":" + ((.value|keys|sort)|join(","))' "$body"
            jq -r 'to_entries | sort_by(.key) | .[] | select((.value|type)=="array" and (.value|length)>0) | "ARRAY_ITEM_TYPE=" + .key + ":" + (.value[0]|type)' "$body"
            jq -r 'to_entries | sort_by(.key) | .[] | select((.value|type)=="array" and (.value|length)>0 and (.value[0]|type)=="object") | "ARRAY_ITEM_KEYS=" + .key + ":" + ((.value[0]|keys|sort)|join(","))' "$body"
          elif [[ "$(jq -r 'type' "$body")" == "array" ]]; then
            echo "ROOT_ARRAY_LENGTH=$(jq 'length' "$body")"
            if [[ "$(jq 'length' "$body")" -gt 0 ]]; then
              echo "ROOT_ARRAY_ITEM_TYPE=$(jq -r '.[0]|type' "$body")"
              if [[ "$(jq -r '.[0]|type' "$body")" == "object" ]]; then
                echo "ROOT_ARRAY_ITEM_KEYS=$(jq -r '.[0]|keys|sort|join(",")' "$body")"
              fi
            fi
          fi

          echo "PROVIDER_HTTP_METHODS_USED=GET_ONLY"
          echo "PROVIDER_MUTATION_PERFORMED=false"
          echo "RESPONSE_VALUES_PRINTED=false"

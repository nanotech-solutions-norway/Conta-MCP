name: Conta Sandbox Invoice Draft Controlled Validation

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Type APPROVE_CONTA_SANDBOX_INVOICE_DRAFT_CONTROLLED_VALIDATION exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conta-sandbox-invoice-draft-controlled-validation
  cancel-in-progress: false

jobs:
  execute-authorized-retry-series:
    name: Execute authorized sandbox invoice draft validation
    if: ${{ inputs.authorization == 'APPROVE_CONTA_SANDBOX_INVOICE_DRAFT_CONTROLLED_VALIDATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: conta-sandbox-secrets
    env:
      CONTA_ENVIRONMENT: ${{ vars.CONTA_ENVIRONMENT }}
      CONTA_API_BASE_URL: ${{ vars.CONTA_API_BASE_URL }}
      CONTA_API_KEY: ${{ secrets.CONTA_API_KEY }}
      CONTA_ORG_ID: ${{ secrets.CONTA_ORG_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify controlled-validation authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTA_ENVIRONMENT" == "sandbox" ]] || { echo "Protected environment is not sandbox." >&2; exit 1; }
          [[ "$CONTA_API_BASE_URL" == "https://api.gateway.conta-sandbox.no" ]] || { echo "Unexpected Conta API base URL." >&2; exit 1; }
          [[ -n "${CONTA_API_KEY:-}" ]] || { echo "Missing protected Conta API key." >&2; exit 1; }
          [[ "$CONTA_ORG_ID" =~ ^[0-9]+$ ]] || { echo "Invalid protected organization identifier." >&2; exit 1; }
          [[ "${{ inputs.authorization }}" == "APPROVE_CONTA_SANDBOX_INVOICE_DRAFT_CONTROLLED_VALIDATION" ]] || { echo "Exact manual dispatch authorization token missing." >&2; exit 1; }
          echo "CONTROLLED_VALIDATION_AUTHORIZATION_BOUNDARY=true"
          echo "PRODUCTION_WRITE_AUTHORIZED=false"

      - name: Validate baked sandbox harness
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Config.php
          php -l .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "const EXPECTED_PAYLOAD_SHA256 = '79ae9a521fb79e1852721eb4f4f25e315d3122849bfe2b2df146e761d974cee7';" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "'vatCode' => 'high'" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "'lineNo' => 1" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "PROVIDER_ERROR_BODY_SHA256" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "PROVIDER_ERROR_TOP_LEVEL_KEYS" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          grep -q "PROVIDER_ERROR_KEY_PATHS" .github/scripts/conta-sandbox-invoice-draft-one-call.php
          php -r 'require "app/Config.php"; $c=new Config(["allowed_write_organization_ids"=>["123456789","123456789"]]); $v=$c->allowedWriteOrganizationIds(); if ($v !== ["123456789"] || !is_string($v[0])) { fwrite(STDERR,"numeric_org_allowlist_regression\n"); exit(1); } echo "NUMERIC_ORGANIZATION_ALLOWLIST_REGRESSION_PASSED=true\n";'
          echo "BAKED_SANDBOX_HARNESS_VALIDATED=true"

      - name: Retry authorized sandbox invoice draft until complete
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          attempt=0
          max_attempts=3

          while [[ "$attempt" -lt "$max_attempts" ]]; do
            attempt=$((attempt + 1))
            echo "RETRY_ATTEMPT=$attempt"
            log="$RUNNER_TEMP/conta-invoice-draft-retry-${attempt}.log"

            set +e
            CONTA_RETRY_ATTEMPT="$attempt" php .github/scripts/conta-sandbox-invoice-draft-one-call.php >"$log" 2>&1
            code=$?
            set -e

            cat "$log"

            if [[ "$code" -eq 0 ]]; then
              echo "RETRY_UNTIL_COMPLETE_RESULT=SUCCEEDED"
              echo "RETRY_ATTEMPTS_USED=$attempt"
              exit 0
            fi

            ledger_reserved="$(grep -E '^LEDGER_RESERVED=' "$log" | tail -1 | cut -d= -f2 || true)"
            provider_status="$(grep -E '^PROVIDER_RESULT_STATUS=' "$log" | tail -1 | cut -d= -f2 || true)"
            execution_outcome="$(grep -E '^EXECUTION_OUTCOME=' "$log" | tail -1 | cut -d= -f2 || true)"

            echo "RETRY_CLASSIFICATION_LEDGER_RESERVED=${ledger_reserved:-unknown}"
            echo "RETRY_CLASSIFICATION_PROVIDER_STATUS=${provider_status:-unknown}"
            echo "RETRY_CLASSIFICATION_OUTCOME=${execution_outcome:-unknown}"

            if grep -Eq 'invoice_draft_prestate_not_empty|SUCCEEDED_OBJECT_OBSERVED_UNVERIFIED|SUCCEEDED_OBJECT_OBSERVED_BY_POSTSTATE_GET_UNVERIFIED|same_key_replay_was_not_rejected' "$log"; then
              echo "RETRY_TERMINAL_SAFETY_STOP=true" >&2
              echo "No further provider mutation will be attempted because an object exists or replay protection failed." >&2
              exit "$code"
            fi

            if [[ "$ledger_reserved" == "true" ]] && grep -Eq 'INDETERMINATE_EXCEPTION_AFTER_OR_BEFORE_DISPATCH|FAILED_OR_INDETERMINATE_NO_RETURNED_OBJECT_ID' "$log"; then
              echo "RETRY_TERMINAL_SAFETY_STOP=true" >&2
              echo "No further provider mutation will be attempted because dispatch may have occurred and outcome is indeterminate." >&2
              exit "$code"
            fi

            if [[ "$provider_status" =~ ^4[0-9][0-9]$ && "$provider_status" != "429" ]]; then
              echo "RETRY_TERMINAL_PROVIDER_4XX=true" >&2
              echo "PROVIDER_4XX_STATUS=$provider_status" >&2
              echo "No further provider mutation will be attempted until the request/entitlement error is diagnosed and corrected." >&2
              exit "$code"
            fi

            if [[ "$ledger_reserved" != "true" ]] && grep -Eq 'invoice_draft_prestate_(unrecognized|not_json|get_failed_http_)|synthetic_customer_(search_failed|exact_match_count_|readback_failed|identity_mismatch)|PRIMARY_ERROR_CLASS=(write_organization_not_allowlisted|write_action_not_allowlisted|write_route_not_allowlisted|approval_|sandbox_authorization_|write_dispatch_|release_manifest_|write_tools_|runtime_write_|execution_)' "$log"; then
              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "RETRY_MAX_ATTEMPTS_REACHED=true" >&2
                exit "$code"
              fi
              delay=$((attempt * 5))
              echo "SAFE_RETRY_CONFIRMED=true"
              echo "RETRY_DELAY_SECONDS=$delay"
              sleep "$delay"
              continue
            fi

            if [[ "$execution_outcome" == "FAILED_NO_OBJECT_OBSERVED_BY_POSTSTATE_GET" ]] && { [[ "$provider_status" == "429" ]] || [[ "$provider_status" =~ ^5[0-9][0-9]$ ]]; }; then
              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "RETRY_MAX_ATTEMPTS_REACHED=true" >&2
                exit "$code"
              fi
              delay=$((attempt * 5))
              echo "SAFE_RETRY_CONFIRMED=true"
              echo "RETRY_DELAY_SECONDS=$delay"
              sleep "$delay"
              continue
            fi

            echo "RETRY_UNCLASSIFIED_FAILURE_SAFETY_STOP=true" >&2
            echo "Failure was not proven transient and safe for another provider mutation." >&2
            exit "$code"
          done

          echo "RETRY_MAX_ATTEMPTS_REACHED=true" >&2
          exit 1

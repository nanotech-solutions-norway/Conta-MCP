name: Conta Sandbox Invoice Draft Retry Until Complete

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Type APPROVE_CONTA_SANDBOX_INVOICE_DRAFT_RETRY_UNTIL_COMPLETE exactly'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'docs/rollout/SANDBOX_INVOICE_DRAFT_RETRY_AUTHORIZATION_20260814.md'
      - 'docs/rollout/SANDBOX_INVOICE_DRAFT_RETRY_CONTINUATION_20260815.md'

permissions:
  contents: read

concurrency:
  group: conta-sandbox-invoice-draft-retry-until-complete
  cancel-in-progress: false

jobs:
  execute-authorized-retry-series:
    name: Execute authorized sandbox invoice draft until complete
    if: ${{ github.event_name == 'push' || inputs.authorization == 'APPROVE_CONTA_SANDBOX_INVOICE_DRAFT_RETRY_UNTIL_COMPLETE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: conta-sandbox-secrets
    env:
      CONTA_ENVIRONMENT: ${{ vars.CONTA_ENVIRONMENT }}
      CONTA_API_BASE_URL: ${{ vars.CONTA_API_BASE_URL }}
      CONTA_API_KEY: ${{ secrets.CONTA_API_KEY }}
      CONTA_ORG_ID: ${{ secrets.CONTA_ORG_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Verify retry-until-complete authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTA_ENVIRONMENT" == "sandbox" ]] || { echo "Protected environment is not sandbox." >&2; exit 1; }
          [[ "$CONTA_API_BASE_URL" == "https://api.gateway.conta-sandbox.no" ]] || { echo "Unexpected Conta API base URL." >&2; exit 1; }
          [[ -n "${CONTA_API_KEY:-}" ]] || { echo "Missing protected Conta API key." >&2; exit 1; }
          [[ "$CONTA_ORG_ID" =~ ^[0-9]+$ ]] || { echo "Invalid protected organization identifier." >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "${{ inputs.authorization }}" == "APPROVE_CONTA_SANDBOX_INVOICE_DRAFT_RETRY_UNTIL_COMPLETE" ]] || { echo "Exact manual dispatch authorization token missing." >&2; exit 1; }
          fi
          echo "RETRY_UNTIL_COMPLETE_AUTHORIZATION_BOUNDARY=true"
          echo "PRODUCTION_WRITE_AUTHORIZED=false"

      - name: Apply observed sandbox compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-conta-sandbox-invoice-draft-retry.py
          php -l app/Config.php
          php -l .github/scripts/conta-sandbox-invoice-draft-one-call.php
          php -r 'require "app/Config.php"; $c=new Config(["allowed_write_organization_ids"=>["123456789"]]); $v=$c->allowedWriteOrganizationIds(); if ($v !== ["123456789"] || !is_string($v[0])) { fwrite(STDERR,"numeric_org_allowlist_regression\n"); exit(1); } echo "NUMERIC_ORGANIZATION_ALLOWLIST_REGRESSION_PASSED=true\n";'

      - name: Retry authorized sandbox invoice draft until complete
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "RETRY_ATTEMPT=$attempt"
            log="$RUNNER_TEMP/conta-invoice-draft-retry-${attempt}.log"

            set +e
            CONTA_RETRY_ATTEMPT="$attempt" php .github/scripts/conta-sandbox-invoice-draft-one-call.php >"$log" 2>&1
            code=$?
            set -e

            cat "$log"

            if [[ "$code" -eq 0 ]]; then
              echo "RETRY_UNTIL_COMPLETE_RESULT=SUCCEEDED"
              echo "RETRY_ATTEMPTS_USED=$attempt"
              exit 0
            fi

            ledger_reserved="$(grep -E '^LEDGER_RESERVED=' "$log" | tail -1 | cut -d= -f2 || true)"

            if grep -Eq 'invoice_draft_prestate_not_empty|SUCCEEDED_OBJECT_OBSERVED_UNVERIFIED|SUCCEEDED_OBJECT_OBSERVED_BY_POSTSTATE_GET_UNVERIFIED|same_key_replay_was_not_rejected' "$log"; then
              echo "RETRY_TERMINAL_SAFETY_STOP=true" >&2
              echo "No further provider mutation will be attempted because an object exists or replay protection failed." >&2
              exit "$code"
            fi

            if [[ "$ledger_reserved" == "true" ]] && grep -Eq 'INDETERMINATE_EXCEPTION_AFTER_OR_BEFORE_DISPATCH|FAILED_OR_INDETERMINATE_NO_RETURNED_OBJECT_ID' "$log"; then
              echo "RETRY_TERMINAL_SAFETY_STOP=true" >&2
              echo "No further provider mutation will be attempted because dispatch may have occurred and outcome is indeterminate." >&2
              exit "$code"
            fi

            if grep -Eq 'FAILED_NO_OBJECT_OBSERVED_BY_POSTSTATE_GET|invoice_draft_prestate_(unrecognized|not_json|get_failed_http_)|synthetic_customer_(search_failed|exact_match_count_|readback_failed|identity_mismatch)' "$log" || \
               { [[ "$ledger_reserved" == "false" ]] && grep -Eq 'PRIMARY_ERROR_CLASS=(write_organization_not_allowlisted|write_action_not_allowlisted|write_route_not_allowlisted|approval_|sandbox_authorization_|write_dispatch_|release_manifest_|write_tools_|runtime_write_|execution_)' "$log"; }; then
              delay=$((attempt * 5))
              if [[ "$delay" -gt 30 ]]; then delay=30; fi
              echo "SAFE_RETRY_CONFIRMED=true"
              echo "RETRY_DELAY_SECONDS=$delay"
              sleep "$delay"
              continue
            fi

            echo "RETRY_UNCLASSIFIED_FAILURE_SAFETY_STOP=true" >&2
            echo "Failure was not proven safe for another provider mutation." >&2
            exit "$code"
          done
